---
- name: Ensure monitoring network exists
  ansible.builtin.command:
    cmd: docker network create monitoring-network
  register: monitoring_network
  changed_when: monitoring_network.rc == 0
  failed_when: >-
    monitoring_network.rc != 0
    and 'already exists' not in monitoring_network.stderr

- name: Create grafana directory
  ansible.builtin.file:
    path: /opt/grafana
    state: directory
    owner: "{{ ansible_user }}"
    group: docker
    mode: '0755'

- name: Copy docker-compose.yaml
  ansible.builtin.copy:
    src: docker-compose.yaml
    dest: /opt/grafana/docker-compose.yaml
    owner: "{{ ansible_user }}"
    group: docker
    mode: '0644'

- name: Start Grafana
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/grafana
