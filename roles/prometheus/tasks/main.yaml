---
- name: Ensure monitoring network exists
  ansible.builtin.command:
    cmd: docker network create monitoring-network
  register: monitoring_network
  changed_when: monitoring_network.rc == 0
  failed_when: >-
    monitoring_network.rc != 0
    and 'already exists' not in monitoring_network.stderr

- name: Create prometheus directory
  ansible.builtin.file:
    path: /opt/prometheus
    state: directory
    owner: "{{ ansible_user }}"
    group: docker
    mode: '0755'

- name: Copy docker-compose.yaml
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: /opt/prometheus/docker-compose.yaml
    owner: "{{ ansible_user }}"
    group: docker
    mode: '0644'

- name: Copy prometheus.yml
  ansible.builtin.copy:
    src: prometheus.yml
    dest: /opt/prometheus/prometheus.yml
    owner: "{{ ansible_user }}"
    group: docker
    mode: '0644'

- name: Start Prometheus and cAdvisor
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate
    chdir: /opt/prometheus
